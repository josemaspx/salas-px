<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#102e4c" />
    <meta
      name="description"
      content="Mapa interativo das salas de reunião do escritório Motorista PX."
    />
    <title>Salas PX</title>
    <link rel="stylesheet" href="styles.css?v=__BUILD_VERSION__" />
  </head>
  <body>
    <a class="skip-link" href="#mapa">Ir para o mapa</a>

    <header class="topbar">
      <div class="brand" aria-label="Salas PX">
        <img class="brand-mark" src="logo-px-oficial.svg" alt="PX" />
        <span class="brand-name">Salas PX</span>
      </div>
      <span class="status"><span class="status-dot"></span>Mapa do escritório</span>
    </header>

    <main class="page-shell">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">MAPA INTERATIVO</p>
        <h1 id="page-title">Salas PX</h1>
        <p>Encontre sua sala pelo nome ou toque no mapa para ver a referência.</p>

        <div class="finder">
          <label class="search-box" for="room-search">
            <span aria-hidden="true">⌕</span>
            <input
              id="room-search"
              type="search"
              placeholder="Ex.: Protagonismo"
              autocomplete="off"
              aria-controls="room-results"
            />
          </label>
          <div id="room-results" class="room-results" role="listbox" hidden></div>
        </div>

        <div id="quick-rooms" class="quick-rooms" aria-label="Atalhos para salas"></div>
      </section>

      <section class="map-card" aria-labelledby="map-title">
        <div class="map-card-header">
          <div>
            <p class="map-kicker">PLANTA INTERATIVA</p>
            <h2 id="map-title">Toque em uma sala</h2>
          </div>
          <div class="map-actions">
            <button id="map-expand" class="expand-button" type="button" aria-label="Abrir mapa em tela cheia" aria-pressed="false">
              <span aria-hidden="true">⛶</span><span class="expand-label">Tela cheia</span>
            </button>
            <div class="zoom-controls" aria-label="Controles de zoom">
              <button id="zoom-out" type="button" aria-label="Diminuir mapa">−</button>
              <button id="zoom-reset" type="button" aria-label="Restaurar zoom">100%</button>
              <button id="zoom-in" type="button" aria-label="Ampliar mapa">+</button>
            </div>
          </div>
        </div>

        <div id="mapa" class="map-viewport" tabindex="0">
          <div id="map-stage" class="map-stage">
            <img
              src="Mapa-PX---Salas-de-Reunião-06%204.png"
              alt="Planta do escritório Motorista PX com os espaços Marte, Relax, Sky, Millennium Falcon e Recepção."
              width="650"
              height="785"
              draggable="false"
            />
            <svg
              id="hotspot-layer"
              class="hotspot-layer"
              viewBox="0 0 650 785"
              aria-label="Salas clicáveis do mapa"
            ></svg>
          </div>
        </div>

        <p class="map-hint"><span aria-hidden="true">☝</span> As áreas com contorno são clicáveis.</p>
      </section>
    </main>

    <dialog id="room-dialog" class="room-dialog" aria-labelledby="dialog-title">
      <button id="dialog-close" class="dialog-close" type="button" aria-label="Fechar">×</button>
      <div class="dialog-icon" aria-hidden="true">⌖</div>
      <p id="dialog-zone" class="dialog-zone"></p>
      <h2 id="dialog-title"></h2>
      <p id="dialog-description" class="dialog-description"></p>
      <div class="reference-card">
        <span>Referência rápida</span>
        <strong id="dialog-reference"></strong>
      </div>
      <button id="show-on-map" class="primary-button" type="button">Mostrar no mapa</button>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js?v=__BUILD_VERSION__"></script>
  </body>
</html>
