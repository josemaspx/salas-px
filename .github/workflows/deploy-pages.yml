name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project
        run: |
          node --check app.js
          test -f index.html
          test -f styles.css
          test -f logo-px-oficial.svg
          test -f "Mapa-PX---Salas-de-Reunião-06 4.png"

      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html styles.css app.js logo-px-oficial.svg "Mapa-PX---Salas-de-Reunião-06 4.png" _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
